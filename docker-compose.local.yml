services:
  postgres:
    image: postgres:16-alpine
    container_name: db_migrator_service_postgres_local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
      POSTGRES_DB: postgres
      TZ: UTC
    volumes:
      - db_migrator_service_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-local-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_migrator_service_postgres_data:
